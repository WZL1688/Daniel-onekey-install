<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c111b">
  <title>ChainPair · 双链套利工作台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a href="#market" class="brand" aria-label="ChainPair 首页"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 6 3 14l8 8 5-5M21 10l8 8-8 8-5-5M11 22 21 10"/></svg></span><span>ChainPair<small>LOCAL ARBITRAGE TERMINAL</small></span></a>
      <div class="nav-label">工作空间</div>
      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-tab="market"><span class="nav-icon">◈</span>行情首页<span class="nav-dot"></span></button>
        <button class="nav-item" data-tab="settings"><span class="nav-icon">⚙</span>设置与钱包</button>
        <button class="nav-item" data-tab="bridge"><span class="nav-icon">⇄</span>跨链</button>
        <button class="nav-item" data-tab="trades"><span class="nav-icon">▤</span>交易档案</button>
        <button class="nav-item" data-tab="notes"><span class="nav-icon">▧</span>备忘录</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-card"><span class="local-symbol">⌘</span><div>本机工作空间<small>密钥加密保存在本地</small></div><span class="status-dot good"></span></div>
        <div class="version">CHAINPAIR <span>v1.6.0 · 页面</span></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb">行情首页</strong></div><div class="top-meta"><span id="app-build-version" class="badge neutral app-build-version" title="当前页面版本；连接服务后显示本机服务版本">页面 v1.6.0</span><span id="mode-badge" class="badge amber">连接中</span><span class="top-divider"></span><span class="connection"><i id="server-dot" class="status-dot"></i><span id="server-status">连接本机服务</span></span><span id="clock" class="mono"></span></div></header>
      <div id="app-version-notice" class="app-version-notice" role="alert" hidden><p id="app-version-message"></p><button id="app-version-reload" type="button" class="button secondary small">刷新页面</button></div>
      <div id="wallet-signing" class="wallet-signing" role="status" aria-live="polite" hidden></div>
      <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span>正在载入本机工作空间…</div></main>
      <footer class="footer"><span><i class="status-dot good"></i> 本机运行 · 只监听回环地址</span><span>BNB CHAIN <b>⇄</b> SOLANA</span></footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="detail-dialog"><div id="dialog-content"></div><button class="button secondary dialog-close" id="dialog-close">关闭</button></dialog>
  <script src="/vendor/solana-web3.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
